<!DOCTYPE html>
<html lang="pt-BR">
<head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenTranslator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="OpenTranslator.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/png" href="OpenTranslator.png">
    <link rel="apple-touch-icon" href="OpenTranslator.png">
    <style>
                * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
        html, body { height: 100%; background: #121316; color: #f1f3f5; font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11'; }
        /* Ultra Crisp HD Font Anti-Aliasing */
        h1, h2, h3, h4, h5, h6, label, span, button, input, select, textarea, div {
            -webkit-font-smoothing: antialiased !important;
            -moz-osx-font-smoothing: grayscale !important;
            text-rendering: optimizeLegibility !important;
        }
        #root {
            display: flex; align-items: center; justify-content: center;
            height: 100vh; width: 100vw;
            font-size: 16px; color: #5c5f66;
            flex-direction: column; gap: 16px;
        }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #2c2e33; border-top-color: #4c9aff;
            border-radius: 50%; animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #app {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
<div id="root"><div class="spinner"></div><span>Carregando OpenTranslator...</span></div>
<script src="app.js"></script>
</body>
</html>
