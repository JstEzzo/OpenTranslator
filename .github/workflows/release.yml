name: Build portable OpenTranslator

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Build launcher and portable runtime
        shell: pwsh
        run: |
          node tools/package_release.js --output "$env:RUNNER_TEMP/OpenTranslator-Portable"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test portable launcher
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'OpenTranslator-Portable'
          $smokeDir = Join-Path $env:RUNNER_TEMP 'OpenTranslator-Smoke'
          Copy-Item -LiteralPath $source -Destination $smokeDir -Recurse
          $launcher = Join-Path $smokeDir 'OpenTranslator.exe'
          $probe = Start-Process -FilePath $launcher -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw "Launcher smoke test failed: $($probe.ExitCode)" }
      - name: Archive portable package
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:RUNNER_TEMP/OpenTranslator-Portable/*" -DestinationPath "$env:RUNNER_TEMP/OpenTranslator-Win64-Portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTranslator-Win64-Portable
          path: ${{ runner.temp }}/OpenTranslator-Win64-Portable.zip
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenTranslator-Win64-Portable
      - uses: softprops/action-gh-release@v2
        with:
          files: OpenTranslator-Win64-Portable.zip
          draft: true
          fail_on_unmatched_files: true
