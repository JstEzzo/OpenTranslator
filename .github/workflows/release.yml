name: Build & Release OpenTranslator Single-Executable Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Single Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Tools & Dependencies
        run: |
          cd Tool
          npm install
          npm install -g pkg pyinstaller

      - name: Compile Sidecar Python Binaries
        run: |
          cd Tool
          pyinstaller --onefile --name open_translator_core open_translator.py
          pyinstaller --onefile --name unpack_renpy_core resources/renpy/unpack_renpy_all.py

      - name: Package Single Executable Node Application
        run: |
          cd Tool
          npx pkg server.js --targets node20-win-x64 --output dist/OpenTranslator.exe

      - name: Assemble Release Artifact Bundle
        run: |
          mkdir -p dist/bundle
          cp Tool/dist/OpenTranslator.exe dist/bundle/
          cp -r Tool/www dist/bundle/
          cp -r Tool/config dist/bundle/
          cp -r Tool/resources dist/bundle/
          cp -r Tool/loaders dist/bundle/
          mkdir -p dist/bundle/dist
          cp Tool/dist/open_translator_core.exe dist/bundle/dist/ 2>$null || true
          cp Tool/dist/unpack_renpy_core.exe dist/bundle/dist/ 2>$null || true
          Compress-Archive -Path dist/bundle/* -DestinationPath dist/OpenTranslator-Win64-Portable.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          files: dist/OpenTranslator-Win64-Portable.zip
          name: OpenTranslator Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
